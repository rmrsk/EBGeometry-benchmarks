name: Bump EBGeometry

# Keeps Submodules/EBGeometry tracking the latest commit on EBGeometry's main branch, so a fresh
# clone of this repo is never more than one polling interval stale. EBGeometry has no tagged
# releases yet; once it starts cutting them, switch the `git ls-remote` below from
# `refs/heads/main` to the latest tag (e.g. via the GitHub releases API) to track releases instead
# of every main-branch commit.
#
# Validate-then-commit: the candidate EBGeometry commit is built and run (via build-and-run.yml,
# the same job CI.yml uses) BEFORE it is ever pinned. The `commit` job below only runs if that
# validation job succeeds, so a broken EBGeometry commit never reaches main -- it just makes this
# workflow run fail, which shows up in the Actions tab (and via GitHub's own failed-workflow
# notifications, if enabled under your GitHub notification settings).
#
# This only polls on a schedule -- it cannot react the instant EBGeometry's main branch moves.
# Instant triggering needs a cross-repo `repository_dispatch`: a step at the end of EBGeometry's
# own CI (on push to main) that calls the GitHub API to fire an event here, authenticated with a
# fine-grained PAT stored as a secret in the EBGeometry repo. Deliberately not set up: it requires
# minting a PAT and touching EBGeometry's own CI.yml.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      latest: ${{ steps.check.outputs.latest }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for a newer EBGeometry main commit
        id: check
        run: |
          CURRENT=$(git ls-tree HEAD Submodules/EBGeometry | awk '{print $3}')
          LATEST=$(git ls-remote https://github.com/rmrsk/EBGeometry.git refs/heads/main | awk '{print $1}')
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: [check]
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build-and-run.yml
    with:
      ebgeometry-ref: ${{ needs.check.outputs.latest }}

  commit:
    needs: [check, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bump submodule pointer
        run: |
          git update-index --cacheinfo 160000,${{ needs.check.outputs.latest }},Submodules/EBGeometry
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Bump EBGeometry submodule to ${{ needs.check.outputs.latest }}"
          git push
